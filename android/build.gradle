group 'com.appsflyer.appsflyersdk'
version '1.0-SNAPSHOT'
buildscript {
    repositories {
        mavenCentral()
        google()
    }
}

rootProject.allprojects {
    repositories {
        mavenCentral()
        google()
    }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def includeConnector = project.findProperty('appsflyer.enable_purchase_connector')?.toBoolean() ?: false

android {
    defaultConfig {
        minSdkVersion 21
        compileSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        multiDexEnabled true
    }
    
    lintOptions {
        disable 'InvalidPackage'
    }
    namespace 'com.appsflyer.appsflyersdk'

    sourceSets {
        main {
            java.srcDirs = ['src/main/java', 'src/main/kotlin']
            java.srcDirs += includeConnector ? ['src/main/include-connector'] : ['src/main/exlude-connector']
        }
        includeConnector ? ['src/main/include-connector'] : ['src/main/exlude-connector']
        test {
            java.srcDirs = ['src/test/kotlin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation platform("com.appsflyer:af-android-sdk-bom:7.0.1")
    implementation "com.appsflyer:af-android-sdk"
    implementation "com.appsflyer:af-android-sdk-base"
    implementation "com.appsflyer:af-android-plugin-bridge"

    implementation 'com.android.installreferrer:installreferrer:2.2'
    if (includeConnector) {
        implementation 'com.appsflyer:purchase-connector:2.2.0'
    }

    testImplementation 'junit:junit:4.13.2'
}