<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Quiz · {{QUIZ_TITLE}}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: white;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  max-width: 680px;
  width: 100%;
  padding: 40px;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.quiz-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #7c3aed;
  margin-bottom: 16px;
}
.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.progress-text { font-size: 13px; color: #94a3b8; font-weight: 600; }
.score-live { font-size: 13px; color: #94a3b8; font-weight: 600; }
.progress-bar { display: flex; gap: 5px; margin-bottom: 32px; }
.seg {
  flex: 1; height: 7px; border-radius: 4px;
  background: #e2e8f0; transition: background 0.3s ease;
}
.seg.filled { background: #7c3aed; }
.seg.current { background: #c4b5fd; }
.question { font-size: 19px; font-weight: 700; color: #1e293b; line-height: 1.55; margin-bottom: 26px; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 15px 18px; border: 2px solid #e2e8f0; border-radius: 12px;
  background: white; cursor: pointer; text-align: left;
  font-size: 15px; color: #334155; line-height: 1.5;
  transition: border-color 0.15s, background 0.15s;
}
.opt:hover:not(:disabled) { border-color: #c4b5fd; background: #faf5ff; }
.badge {
  min-width: 28px; height: 28px; border-radius: 7px;
  background: #f1f5f9; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: #64748b; flex-shrink: 0; margin-top: 1px;
  transition: background 0.15s, color 0.15s;
}
.opt.correct { border-color: #22c55e; background: #f0fdf4; }
.opt.correct .badge { background: #22c55e; color: white; }
.opt.wrong { border-color: #ef4444; background: #fef2f2; }
.opt.wrong .badge { background: #ef4444; color: white; }
.opt:disabled { cursor: default; }
.explanation {
  margin-top: 18px; padding: 14px 18px;
  background: #faf5ff; border-left: 4px solid #7c3aed; border-radius: 0 10px 10px 0;
  font-size: 14px; color: #475569; line-height: 1.6; animation: fadeIn 0.25s ease;
}
.next-btn {
  display: block; width: 100%; margin-top: 16px; padding: 15px;
  background: #7c3aed; color: white; border: none; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.15s;
  animation: fadeIn 0.25s ease;
}
.next-btn:hover { background: #6d28d9; }
.final { text-align: center; }
.score-ring {
  width: 130px; height: 130px; border-radius: 50%; border: 6px solid;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin: 0 auto 20px;
}
.score-num { font-size: 36px; font-weight: 900; line-height: 1; }
.score-denom { font-size: 13px; opacity: 0.6; font-weight: 600; }
.grade { font-size: 60px; font-weight: 900; line-height: 1; margin-bottom: 12px; display: block; }
.verdict {
  font-size: 16px; color: #475569; margin-bottom: 28px; line-height: 1.6;
  max-width: 420px; margin-left: auto; margin-right: auto;
}
.stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 28px; }
.stat-n { font-size: 24px; font-weight: 800; color: #1e293b; }
.stat-l { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; margin-top: 2px; }
.retake {
  padding: 14px 36px; background: white; color: #7c3aed;
  border: 2.5px solid #7c3aed; border-radius: 12px;
  font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.retake:hover { background: #7c3aed; color: white; }
.ga { color: #16a34a; border-color: #16a34a; }
.gb { color: #2563eb; border-color: #2563eb; }
.gc { color: #d97706; border-color: #d97706; }
.gf { color: #dc2626; border-color: #dc2626; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
const QUIZ_TITLE = "{{QUIZ_TITLE}}";
const qs = {{QUESTIONS_JSON}};

let cur = 0, score = 0, picked = false;

function render() {
  picked = false;
  const q = qs[cur];
  const segs = Array.from({length:10},(_,i)=>
    `<div class="seg${i<cur?' filled':i===cur?' current':''}"></div>`).join('');
  const opts = q.opts.map((o,i)=>`
    <button class="opt" onclick="pick(${i})" id="o${i}">
      <span class="badge">${'ABCD'[i]}</span>
      <span>${o}</span>
    </button>`).join('');
  document.getElementById('card').innerHTML = `
    <div class="quiz-label">Tech Quiz · ${QUIZ_TITLE}</div>
    <div class="progress-row">
      <span class="progress-text">Question ${cur+1} of ${qs.length}</span>
      <span class="score-live">${score} pts</span>
    </div>
    <div class="progress-bar">${segs}</div>
    <div class="question">${q.q}</div>
    <div class="options">${opts}</div>
    <div id="fb"></div>`;
}

function pick(i) {
  if (picked) return;
  picked = true;
  const q = qs[cur];
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  if (i === q.ans) {
    score += 10;
    document.getElementById('o'+i).classList.add('correct');
  } else {
    document.getElementById('o'+i).classList.add('wrong');
    document.getElementById('o'+q.ans).classList.add('correct');
  }
  const last = cur === qs.length - 1;
  document.getElementById('fb').innerHTML = `
    <div class="explanation">${q.exp}</div>
    <button class="next-btn" onclick="${last?'finish()':'next()'}">${last?'See Results →':'Next →'}</button>`;
}

function next() { cur++; render(); }

function finish() {
  let gc, gl, vd;
  if (score >= 90)      { gc='ga'; gl='A'; vd="Deep understanding of the feature area. You're ready to own this."; }
  else if (score >= 75) { gc='gb'; gl='B'; vd="Solid grasp with a few gaps. Worth revisiting the weaker sections."; }
  else if (score >= 60) { gc='gc'; gl='C'; vd="Partial understanding — a closer read of the tech design is recommended before approving."; }
  else                  { gc='gf'; gl='F'; vd="Needs a thorough review before approving this feature."; }
  const c = score / 10;
  document.getElementById('card').innerHTML = `
    <div class="final">
      <div class="quiz-label">Quiz Complete · ${QUIZ_TITLE}</div>
      <div class="score-ring ${gc}">
        <div class="score-num ${gc}">${score}</div>
        <div class="score-denom">/ 100</div>
      </div>
      <span class="grade ${gc}">${gl}</span>
      <div class="verdict">${vd}</div>
      <div class="stats">
        <div><div class="stat-n">${c}</div><div class="stat-l">Correct</div></div>
        <div><div class="stat-n">${10-c}</div><div class="stat-l">Wrong</div></div>
        <div><div class="stat-n">${score}</div><div class="stat-l">Points</div></div>
      </div>
      <button class="retake" onclick="restart()">↺ Retake Quiz</button>
    </div>`;
}

function restart() { cur = 0; score = 0; render(); }
render();
</script>
</body>
</html>
